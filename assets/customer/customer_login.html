<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .container img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        .container h1 {
            font-size: 28px;
            color: #4a4a4a;
            margin-bottom: 20px;
        }

        .container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .container form input {
            padding: 10px 15px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        .container form input:focus {
            border-color: #007bff;
        }

        .container button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .container button:hover {
            background-color: #0056b3;
        }

        .toggle-link {
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <img src="../logo kopi.jpg" alt="Coffee Cup">
        <h1>Halaman Customer</h1>
        <form id="loginForm" action="../php/validate_login_customer.php" method="POST">
            <input type="text" id="loginUsername" name="username" placeholder="Username" required>
            <input type="password" id="loginPassword" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
        <a class="toggle-link" onclick="toggleForm()">Don't have an account? Sign Up</a>
        <h2 class="toggle-link" onclick="toggleForm()">Lupa Password? Klik Di sini</h2>
    </div>

    <div class="container" id="signUpContainer" style="display: none;">
        <img src="../logo kopi.jpg" alt="Coffee Cup">
        <h1>Customer Sign Up</h1>
        <form id="signUpForm" action="../php/register_customer.php" method="POST">
            <input type="text" id="signUpUsername" name="username" placeholder="Username" required>
            <input type="password" id="signUpPassword" name="password" placeholder="Password" required>
            <button type="submit">SIGN UP</button>
        </form>
        <a class="toggle-link" onclick="toggleForm()">Already have an account? Login</a>
    </div>

    <script>
        function toggleForm() {
            const loginContainer = document.getElementById('loginContainer');
            const signUpContainer = document.getElementById('signUpContainer');

            if (loginContainer.style.display === 'none') {
                loginContainer.style.display = 'block';
                signUpContainer.style.display = 'none';
            } else {
                loginContainer.style.display = 'none';
                signUpContainer.style.display = 'block';
            }
        }
    </script>
</body>
</html>
