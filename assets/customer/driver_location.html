<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Location</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #333;
    }

    .background-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://source.unsplash.com/1600x900/?coffee') no-repeat center center fixed;
      background-size: cover;
      z-index: -1;
      animation: panBackground 30s infinite linear;
    }

    @keyframes panBackground {
      from {
        background-position: 0% 0%;
      }
      to {
        background-position: 100% 100%;
      }
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      color: #6B4226;
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    }

    .map {
      text-align: center;
      margin: 30px 0;
    }

    .map img {
      max-width: 100%;
      border-radius: 12px;
      border: 3px solid #ddd;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .map img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .button-container {
      text-align: center;
      margin-top: 20px;
    }

    .button {
      text-decoration: none;
      background-color: #6B4226;
      color: white;
      padding: 12px 25px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      margin: 5px;
      transition: background-color 0.3s ease, transform 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .button:hover {
      background-color: #5A3A1E;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="background-animation"></div>
  <div class="container">
    <h1>Driver Locations</h1>

    <!-- Gerobak Kopi A -->
    <div class="map">
      <h3>Gerobak Kopi A</h3>
      <img src="../images/coffee_A.jpg" alt="Gerobak Kopi A Map">
      <div class="button-container">
        <a href="https://www.google.com/maps?q=-6.175110,106.865039" target="_blank" class="button">View Gerobak Kopi A</a>
        <div class="button-container">
            <a href="order.html" class="button">Klik di sini buat order! </a>
          </div>
      </div>
    </div>

    <!-- Gerobak Kopi B -->
    <div class="map">
      <h3>Gerobak Kopi B</h3>
      <img src="../images/coffee_B.jpg" alt="Gerobak Kopi B Map">
      <div class="button-container">
        <a href="https://www.google.com/maps?q=-6.200000,106.800000" target="_blank" class="button">View Gerobak Kopi B</a>
        <div class="button-container">
            <a href="order.html" class="button">Klik di sini buat order! </a>
          </div>
      </div>
    </div>

    <!-- Gerobak Kopi C -->
    <div class="map">
      <h3>Gerobak Kopi C</h3>
      <img src="../images/coffee_C.jpg" alt="Gerobak Kopi C Map">
      <div class="button-container">
        <a href="https://www.google.com/maps?q=-6.300000,106.900000" target="_blank" class="button">View Gerobak Kopi C</a>
        <div class="button-container">
            <a href="order.html" class="button">Klik di sini buat order! </a>
          </div>
      </div>
    </div>

  <footer>
    &copy; 2024 NAPI (Nyari Kopi). All rights reserved.
  </footer>
</body>
</html>
