<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Verified</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background-color: #f0d3a2; /* Background color */
    color: #3a2e2e; /* Text color */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50vh;
}

.container {
    background-color: #fff6e1; /* Container background color */
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    text-align: center;
    width: 90%;
    max-width: 400px;
}

h1 {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 20px;
    color: #3a2e2e;
}

p {
    font-size: 1.2rem;
    margin-bottom: 20px;
}

a {
    display: inline-block;
    padding: 10px 20px;
    background-color: #3a2e2e;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    font-size: 1rem;
    transition: background-color 0.3s ease;
}

a:hover {
    background-color: #d79805;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>Order Verified</h1>
        <p>Your payment has been successfully verified. Enjoy your coffee!</p>
        <a href="../index.html">Back to Home</a>
    </div>
</body>
</html>
