<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #3e2723, #1b1b1b); /* Background coklat */
            color: #ffffff;
            overflow: hidden;
        }

        .dashboard-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 300px;
            background: linear-gradient(135deg, #4e342e, #5d4037); /* Sidebar coklat gelap */
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            padding: 20px;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #ffab91; /* Warna aksen oranye */
            text-shadow: 0 0 10px #ffab91, 0 0 20px #ffab91;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 20px 0;
        }

        .sidebar ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar ul li a i {
            margin-right: 15px;
        }

        .sidebar ul li a:hover {
            background: #ffab91;
            color: #1b1b1b;
            box-shadow: 0 0 15px #ffab91;
        }

        /* Content Styling */
        .content {
            margin-left: 300px;
            padding: 50px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease-in-out;
        }

        .content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffab91;
            text-shadow: 0 0 10px #ffab91, 0 0 30px #ffab91;
        }

        .content p {
            font-size: 18px;
            line-height: 1.6;
            color: #e0e0e0;
            max-width: 700px;
            text-align: center;
        }

        /* Card Styling */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: linear-gradient(135deg, #4e342e, #6d4c41); /* Card gradien coklat */
            border-radius: 15px;
            width: 250px;
            height: 150px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        }

        .card i {
            font-size: 40px;
            margin-bottom: 10px;
            color: #ffab91;
        }

        .card span {
            font-size: 18px;
            font-weight: bold;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }

            .content {
                margin-left: 250px;
                padding: 30px;
            }

            .content h1 {
                font-size: 36px;
            }

            .card {
                width: 200px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Driver Dashboard</h2>
            <ul>
                <li><a href="contact_admin.html"><i class="fas fa-phone"></i> Contact Admin</a></li>
                <li><a href="restock_list.html"><i class="fas fa-clipboard-list"></i> Restock List</a></li>
                <li><a href="activate_location.html"><i class="fas fa-map-marker-alt"></i> Activate Location</a></li>
                <li><a href="orders.html"><i class="fas fa-box"></i> Manage Orders</a></li>
                <li><a href="../driver/driver_login.html" onclick="logout('driver')"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Content -->
        <div class="content">
            <h1>Selamat Datang, Driver NAPI (Nyari Kopi)!</h1>
            <p>Kelola Fitur Driver Dengan Mudah!</p>

            <!-- Card Container -->
            <div class="card-container">
                <a href="contact_admin.html" class="card">
                    <i class="fas fa-phone"></i>
                    <span>Contact Admin</span>
                </a>
                <a href="restock_list.html" class="card">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Restock List</span>
                </a>
                <a href="activate_location.html" class="card">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Activate Location</span>
                </a>
                <a href="orders.html" class="card">
                    <i class="fas fa-box"></i>
                    <span>Manage Orders</span>
                </a>
            </div>
        </div>
    </div>
    <script>
        function logout(role) {
            alert(`${role.charAt(0).toUpperCase() + role.slice(1)} has been logged out!`);
            window.location.href = `../${role}_login.html`;
        }
    </script>
</body>
</html>
