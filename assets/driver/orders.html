<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0d3a2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff6e1;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3a2e2e;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .status-paid {
            color: green;
        }
        .status-pending {
            color: red;
        }
    </style>
</head>
<body>
    <h1>List Order Masuk</h1>
    <table>
        <thead>
            <tr>
                <th>Nama Customer</th>
                <th>Nama Menu</th>
                <th>Harga</th>
                <th>Status</th>
                <th>Waktu</th>
                <th>Konfirmasi Pesanan</th>
            </tr>
        </thead>
        <tbody id="orders-table">
            <!-- Orders will be loaded here -->
        </tbody>
    </table>

    <script>
        function loadOrders() {
            fetch('../php/get_orders.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const ordersTable = document.getElementById('orders-table');
                        ordersTable.innerHTML = ''; // Kosongkan tabel sebelum menampilkan data baru

                        data.orders.forEach(order => {
                            const row = `
                                <tr>
                                    <td>${order.customer_name}</td>
                                    <td>${order.menu_name}</td>
                                    <td>${order.price}</td>
                                    <td style="color: ${order.status === 'Paid' ? 'green' : 'red'};">
                                        ${order.status}
                                    </td>
                                    <td>${new Date(order.order_time).toLocaleString()}</td>
                                    <td>
                                        <input type="checkbox" id="order-${order.id}" 
                                            onchange="confirmOrder('${order.id}')">
                                        <label for="order-${order.id}">Pesanan Siap</label>
                                    </td>
                                </tr>
                            `;
                            ordersTable.innerHTML += row;
                        });
                    } else {
                        alert(`Error: ${data.message}`);
                    }
                })
                .catch(error => {
                    console.error('Error loading orders:', error);
                    alert('An error occurred while loading orders. Please try again.');
                });
        }

        // Fungsi untuk menampilkan notifikasi ketika pesanan dikonfirmasi
        function confirmOrder(orderId) {
            const checkbox = document.getElementById(`order-${orderId}`);
            if (checkbox.checked) {
                alert(`Pesanan ID ${orderId} sudah siap!`);
                // Tambahkan logika lain jika perlu, seperti update status ke server
            }
        }

        // Muat data pesanan saat halaman dimuat
        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
