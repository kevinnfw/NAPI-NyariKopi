<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Admin</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Optional inline styles for better UI */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #responseMessage {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Contact Admin</h1>
    <form id="contactForm" method="POST">
        <label for="sender_id">Your ID:</label>
        <input type="number" id="sender_id" name="sender_id" required placeholder="Enter your ID">

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required placeholder="Enter your message"></textarea>

        <button type="submit">Send</button>
    </form>
    <div id="responseMessage"></div>

    <script>
        $(document).ready(function () {
            $('#contactForm').on('submit', function (e) {
                e.preventDefault(); // Prevent default form submission

                // Extract form data
                const sender_id = $('#sender_id').val().trim();
                const message = $('#message').val().trim();
                const responseMessage = $('#responseMessage');

                // Validate inputs
                if (!sender_id || !message) {
                    responseMessage.text("Please fill out all fields.").css("color", "red");
                    return;
                }

                // Clear previous messages
                responseMessage.text("");

                // Send data via AJAX
                $.post('../php/contact_admin.php', { sender_id, message })
                    .done(function (response) {
                        try {
                            const jsonResponse = typeof response === "string" ? JSON.parse(response) : response;

                            if (jsonResponse.status === "success") {
                                responseMessage.text(jsonResponse.message).css("color", "green");
                                $('#contactForm')[0].reset(); // Reset the form
                            } else {
                                responseMessage.text(jsonResponse.message || "Failed to send message.").css("color", "red");
                            }
                        } catch (error) {
                            responseMessage.text("Unexpected response format. Please try again.").css("color", "red");
                            console.error("Error parsing response:", error);
                        }
                    })
                    .fail(function () {
                        responseMessage.text("Error connecting to the server. Please try again later.").css("color", "red");
                    });
            });
        });
    </script>
</body>
</html>
