<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Payment</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        /* Tambahkan gaya tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 1rem;
            text-align: left;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        table th {
            background-color: #4caf50;
            color: white;
        }

        .action-button {
            background-color: #5d4037;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .action-button:hover {
            background-color: #8e5c42;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirm Payment</h1>
        <table id="ordersTable" border="1">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Order Details</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>        
    </div>

    <script>
        // Fungsi untuk memuat data order
        async function loadOrdersForConfirmPayment() {
    try {
        const response = await fetch('path/to/get_orders_for_confirm_payment.php');
        const orders = await response.json();

        const tableBody = document.querySelector('#ordersTable tbody');
        tableBody.innerHTML = ''; // Kosongkan tabel sebelum memuat data

        orders.forEach(order => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${order.id}</td>
                <td>${order.customer_name}</td>
                <td>${order.details}</td>
                <td>${order.status}</td>
                <td>
                    <input type="checkbox" id="order_${order.id}" onchange="markAsReady(${order.id}, this.checked)">
                    <label for="order_${order.id}">Pesanan Sudah Siap</label>
                </td>
            `;
            tableBody.appendChild(row);
        });
    } catch (error) {
        console.error('Error loading orders:', error);
    }
}

async function markAsReady(orderId, isChecked) {
    try {
        const response = await fetch('path/to/update_order_status.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                id: orderId,
                status: isChecked ? 'Ready' : 'Pending',
            }),
        });

        const result = await response.json();
        if (result.success) {
            alert('Order status updated successfully.');
            loadOrdersForConfirmPayment(); // Reload data untuk refresh status
        } else {
            alert('Failed to update order status.');
        }
    } catch (error) {
        console.error('Error updating order status:', error);
    }
}

// Panggil fungsi saat halaman dimuat
window.onload = loadOrdersForConfirmPayment;
    </script>
</body>
</html>
